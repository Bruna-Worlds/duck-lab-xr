<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0f1020" />
    <meta name="description" content="Duck Lab XR: race a robot duck through courses and your own room, in mixed reality, VR or on a screen." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f1020'/%3E%3Ccircle cx='29' cy='35' r='18' fill='%23ffcf3f'/%3E%3Cellipse cx='49' cy='39' rx='11' ry='6' fill='%23ff7a45'/%3E%3Ccircle cx='33' cy='29' r='4' fill='%230f1020'/%3E%3C/svg%3E"
    />
    <title>Duck Lab XR</title>
    <style>
      @font-face {
        font-family: DuckBebas;
        src: url('fonts/BebasNeue-Regular.ttf');
      }
      html,
      body {
        margin: 0;
        background: #0f1020;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 40%, #1c1d36, #0f1020 70%);
        color: #fff4dc;
        font-family: system-ui, sans-serif;
        transition: opacity 0.6s ease;
      }
      #splash.done {
        opacity: 0;
        pointer-events: none;
      }
      #splash .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 0 24px;
        text-align: center;
      }
      #splash .shadow {
        background: #ffcf3f;
        border-radius: 16px;
        padding: 0 7px 7px 0;
      }
      #splash .title {
        background: #1c1d36;
        border: 3px solid #ffcf3f;
        border-radius: 16px;
        padding: 6px 22px 0;
        font-family: DuckBebas, 'Arial Narrow', sans-serif;
        font-size: 64px;
        letter-spacing: 2px;
        color: #ffcf3f;
      }
      #splash .sub {
        font-weight: 700;
        color: rgba(255, 244, 220, 0.75);
      }
      #splash .bar {
        width: 220px;
        height: 8px;
        border-radius: 4px;
        background: rgba(255, 244, 220, 0.12);
        overflow: hidden;
      }
      #splash .bar i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 4px;
        background: #3de0b8;
        animation: duck-load 1.1s ease-in-out infinite alternate;
      }
      @keyframes duck-load {
        from {
          transform: translateX(-10%);
        }
        to {
          transform: translateX(160%);
        }
      }
      #splash .by {
        margin-top: 10px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.5px;
        color: rgba(255, 244, 220, 0.8);
      }
      #splash .credit {
        margin-top: 18px;
        font-size: 12px;
        color: rgba(255, 244, 220, 0.45);
      }
      #splash .rights {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        padding: 0 16px;
        text-align: center;
        font-size: 12px;
        color: rgba(255, 244, 220, 0.55);
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-live="polite">
      <div class="card">
        <div class="shadow"><div class="title">DUCK LAB XR</div></div>
        <div class="by">Developed by Bruna Worlds</div>
        <div class="sub">Waking up the duck...</div>
        <div class="bar"><i></i></div>
        <div class="credit">Microduck model and walking AI (c) Pollen Robotics. Meshes CC BY-NC-SA 4.0.</div>
      </div>
      <footer class="rights">&copy; 2026 BRUNA GOODS LLC. All rights reserved.</footer>
    </div>
    <div id="scene-container"></div>
    <script type="module" src="/src/index.ts"></script>
  </body>
</html>
